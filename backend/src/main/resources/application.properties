# ==============================================================================
# Student Financial Copilot - Spring Boot Application Properties
# ==============================================================================

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ------------------------------------------------------------------------------
# MySQL Database Connection (Runs on Port 3307 in Isolated Mode)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/student_copilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# Spring Data JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Direct JDBC Module Properties
# Demonstrates direct DriverManager and Connection concepts from syllabus
# ------------------------------------------------------------------------------
copilot.jdbc.url=${spring.datasource.url}
copilot.jdbc.username=${spring.datasource.username}
copilot.jdbc.password=${spring.datasource.password}

# ------------------------------------------------------------------------------
# AI Integration & Security
# Loads from GEMINI_API_KEY environment variable. Never hardcoded.
# ------------------------------------------------------------------------------
copilot.ai.gemini-api-key=${GEMINI_API_KEY:}
copilot.ai.model=gemini-2.5-flash

# ------------------------------------------------------------------------------
# CORS Configuration
# ------------------------------------------------------------------------------
copilot.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
